---
apiVersion: v1
kind: Namespace
metadata:
  name: shb-smartcard
  labels:
    app.kubernetes.io/name: coverage
    app.kubernetes.io/part-of: smart-card
    app.kubernetes.io/managed-by: shb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coverity-connect-mcp
  namespace: shb-smartcard
  labels:
    app.kubernetes.io/name: coverity-connect-mcp
    app.kubernetes.io/part-of: smart-card
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coverity-connect-mcp
  template:
    metadata:
      labels:
        app: coverity-connect-mcp
    spec:
      # Image pushed by .github/workflows/build-image.yml on push to main.
      # Package is public on ghcr.io (no imagePullSecrets required).
      containers:
        - name: coverity-connect-mcp
          image: ghcr.io/thienpvt/coverity-connect-mcp:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            # Required - Coverity Connect authentication
            - name: COVAUTHUSER
              valueFrom:
                secretKeyRef:
                  name: coverity-auth
                  key: COVAUTHUSER
            - name: COVAUTHKEY
              valueFrom:
                secretKeyRef:
                  name: coverity-auth
                  key: COVAUTHKEY
            # Required - Coverity server
            - name: COVERITY_HOST
              value: "coverity.shb.com.vn"
            - name: COVERITY_PORT
              value: "8443"
            - name: COVERITY_SSL
              value: "True"
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/9router-ca/shb-ca.cer
            - name: PROXY_HOST
              value: ""
            - name: PROXY_PORT
              value: ""
            - name: FASTMCP_TRANSPORT_SECURITY__ENABLE_DNS_REBINDING_PROTECTION
              value: "false"
            # Optional - corporate proxy
            #- name: PROXY_HOST
            #  value: "bypsproxy.daikin.co.jp"
            #- name: PROXY_PORT
            #  value: "3128"
          volumeMounts:
            - mountPath: /etc/9router-ca
              name: shb-ca
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - configMap:
            defaultMode: 420
            name: shb-ca
          name: shb-ca
---
apiVersion: v1
kind: Service
metadata:
  name: coverity-connect-mcp
  namespace: shb-smartcard
  labels:
    app.kubernetes.io/name: coverity-connect-mcp
    app.kubernetes.io/part-of: smart-card
spec:
  type: NodePort
  selector:
    app: coverity-connect-mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
